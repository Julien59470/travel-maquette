name: Deploy EurAmerica Travel Maquette

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-maquette-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate multi-page demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit HTML, links, accessibility basics and assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          from collections import Counter
          pages=['index.html','amerique.html','europe.html','concept.html','methode.html','prestations.html','faq.html','contact.html']
          assets=['pages.css','pages.js','home.css','home.js','assets/euramerica-route.svg']
          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[];self.links=[];self.tags=Counter();self.images=[]
              def handle_starttag(self,tag,attrs):
                  values=dict(attrs);self.tags[tag]+=1
                  if values.get('id'):self.ids.append(values['id'])
                  if tag in ('a','link','script','img'):
                      url=values.get('href') or values.get('src')
                      if url:self.links.append(url)
                  if tag=='img':self.images.append(values)
          checked={}
          for page in pages:
              content=Path(page).read_text(encoding='utf-8')
              assert content.lower().startswith('<!doctype html>'), f'Doctype manquant : {page}'
              assert 'noindex,nofollow' in content, f'Demo non protégée de l’indexation : {page}'
              assert '<meta name="viewport"' in content or '<meta name="viewport"' in content.replace(', ',','), f'Viewport absent : {page}'
              assert '<title>' in content and 'EurAmerica Travel' in content, f'Titre/marque : {page}'
              assert 'role="dialog"' not in content and 'data-panel=' not in content, f'Ancienne modale : {page}'
              parser=Reader();parser.feed(content);parser.close()
              assert parser.tags['h1']==1, f'H1 invalide ({parser.tags["h1"]}) : {page}'
              assert parser.tags['main']==1, f'Main invalide : {page}'
              assert len(parser.ids)==len(set(parser.ids)), f'IDs dupliqués : {page}'
              for image in parser.images:
                  assert 'alt' in image, f'Image sans alt : {page}'
              assert 'assets/euramerica-route.svg' in content, f'Logo absent : {page}'
              if page=='index.html':
                  assert 'href="home.css"' in content and 'src="home.js"' in content, 'Accueil sans design/JS'
                  assert 'preloader-video' not in content, 'Ancienne introduction imposée'
              else:
                  assert 'href="pages.css"' in content and 'src="pages.js"' in content, f'Ressources manquantes : {page}'
              checked[page]=parser
          for page,parser in checked.items():
              for link in parser.links:
                  parts=urlsplit(link)
                  if parts.scheme or parts.netloc or link.startswith('//'):continue
                  path=unquote(parts.path) or page
                  assert not path.startswith('/'), f'URL absolue interdite {link} dans {page}'
                  assert Path(path).is_file(), f'Lien/ressource cassé {link} dans {page}'
                  if parts.fragment and path in checked:
                      assert unquote(parts.fragment) in checked[path].ids, f'Ancre manquante : {link} dans {page}'
          for asset in assets:
              assert Path(asset).is_file(), f'Asset manquant : {asset}'
              assert Path(asset).stat().st_size>50, f'Asset vide : {asset}'
          print(f'OK: {len(pages)} pages HTML réelles, liens, ancres, images et identité EurAmerica Travel.')
          PY
          node --check pages.js
          node --check home.js
          mkdir -p _site/assets
          cp index.html amerique.html europe.html concept.html methode.html prestations.html faq.html contact.html _site/
          cp pages.css pages.js home.css home.js _site/
          cp assets/euramerica-route.svg _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/euramerica-route.svg
      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
