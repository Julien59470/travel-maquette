name: Deploy Travel Maquette to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-maquette-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package multi-page site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pages and internal links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          files = ['index.html','amerique.html','europe.html','concept.html','methode.html','prestations.html','faq.html','contact.html']
          assets = ['pages.css','pages.js']
          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get('id'): self.ids.add(data['id'])
                  if tag in ('a','link','script'):
                      ref = data.get('href') or data.get('src')
                      if ref: self.links.append(ref)
          parsed = {}
          for name in files:
              source = Path(name).read_text(encoding='utf-8')
              assert source.lower().startswith('<!doctype html>'), f'Invalid doctype: {name}'
              assert 'noindex,nofollow' in source, f'Missing demo noindex: {name}'
              assert 'role="dialog"' not in source and 'data-panel=' not in source, f'Modal remains: {name}'
              doc = Reader();doc.feed(source);parsed[name]=doc
              assert len(doc.ids) == len(set(doc.ids)), f'Duplicate ids in {name}'
              if name != 'index.html':
                  assert 'href="pages.css"' in source and 'src="pages.js"' in source, f'Missing shared assets: {name}'
              else:
                  assert 'id="portal-canvas"' in source, 'Home cinematic portal missing'
                  match = re.search(r'<script>\s*([\s\S]*?)</script>', source)
                  assert match, 'Home inline JavaScript missing'
                  Path('/tmp/travel-inline.js').write_text(match.group(1),encoding='utf-8')
          for name,doc in parsed.items():
              for href in doc.links:
                  if href.startswith(('http:','https:','mailto:','tel:','data:')): continue
                  path,_,frag = href.partition('#')
                  target = path or name
                  if target.startswith('/'): raise AssertionError(f'Absolute path in {name}: {href}')
                  if target and not Path(target).is_file(): raise AssertionError(f'Broken link {href} in {name}')
                  if frag and frag not in parsed[target].ids and Path(target).suffix == '.html':
                      raise AssertionError(f'Missing anchor {href} in {name}')
          print(f'Validated {len(files)} real pages, {len(assets)} shared assets, internal links and anchor destinations.')
          PY
          node --check /tmp/travel-inline.js
          node --check pages.js
          mkdir -p _site
          cp index.html amerique.html europe.html concept.html methode.html prestations.html faq.html contact.html pages.css pages.js _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/contact.html
      - name: Upload full multi-page site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
