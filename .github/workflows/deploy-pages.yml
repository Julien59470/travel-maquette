name: Deploy EurAmerica Travel Maquette

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-maquette-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Optimize photos, verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse optimized photo cache
        uses: actions/cache@v4
        with:
          path: _site/assets/photos
          key: euramerica-unsplash-webp-${{ hashFiles('photos.json') }}
      - name: Download and optimize 21 licensed travel photos
        run: python3 scripts/prepare_photos.py
      - name: Audit HTML, photo assets, links and accessibility basics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          from collections import Counter
          import json
          pages=['index.html','amerique.html','europe.html','concept.html','methode.html','prestations.html','faq.html','contact.html']
          assets=['pages.css','pages.js','home.css','home.js','modern.css','modern-home.css','modern.js','assets/euramerica-route.svg']
          photos=json.loads(Path('photos.json').read_text(encoding='utf-8'))
          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[];self.links=[];self.tags=Counter();self.images=[]
              def handle_starttag(self,tag,attrs):
                  values=dict(attrs);self.tags[tag]+=1
                  if values.get('id'):self.ids.append(values['id'])
                  if tag in ('a','link','script','img'):
                      url=values.get('href') or values.get('src')
                      if url:self.links.append(url)
                  if tag=='img':self.images.append(values)
          checked={};used=set()
          for page in pages:
              content=Path(page).read_text(encoding='utf-8')
              assert content.lower().startswith('<!doctype html>'),f'Doctype: {page}'
              assert 'noindex,nofollow' in content,f'Noindex: {page}'
              assert '<meta name="viewport"' in content,f'Viewport: {page}'
              assert '<title>' in content and 'EurAmerica Travel' in content,f'Title/brand: {page}'
              assert 'role="dialog"' not in content and 'data-panel=' not in content,f'Modal: {page}'
              assert 'images.unsplash.com/photo-' not in content,f'Remote image remains: {page}'
              parser=Reader();parser.feed(content);parser.close()
              assert parser.tags['h1']==1,f'H1: {page}'
              assert parser.tags['main']==1,f'Main: {page}'
              assert len(parser.ids)==len(set(parser.ids)),f'Duplicate IDs: {page}'
              for image in parser.images:
                  assert 'alt' in image,f'Missing alt: {page}'
              assert 'assets/euramerica-route.svg' in content,f'Brand logo missing: {page}'
              if page=='index.html':
                  assert 'href="home.css"' in content and 'src="home.js"' in content and 'href="modern-home.css"' in content,'Home assets'
                  assert 'preloader-video' not in content,'Old preloader'
              else:
                  assert 'href="pages.css"' in content and 'src="pages.js"' in content,f'Shared assets: {page}'
              assert 'href="modern.css"' in content and 'src="modern.js"' in content,f'Modern assets missing: {page}'
              assert 'Plus+Jakarta+Sans' in content and 'Space+Grotesk' in content,f'Fonts missing: {page}'
              assert 'Fraunces:' not in content and 'DM+Sans:' not in content,f'Old fonts: {page}'
              checked[page]=parser
              for source in content.split('assets/photos/')[1:]:
                  name=source.split('.webp')[0]
                  assert name in photos,f'Unknown photo key: {name} in {page}'
                  used.add(name)
          for page,parser in checked.items():
              for link in parser.links:
                  parts=urlsplit(link)
                  if parts.scheme or parts.netloc or link.startswith('//'):continue
                  path=unquote(parts.path) or page
                  assert not path.startswith('/'),f'Absolute URL: {link} in {page}'
                  target=Path('_site') / path if path.startswith('assets/photos/') else Path(path)
                  assert target.is_file(),f'Broken link/image: {link} in {page}'
                  if parts.fragment and path in checked:
                      assert unquote(parts.fragment) in checked[path].ids,f'Anchor: {link} in {page}'
          for asset in assets:
              assert Path(asset).is_file() and Path(asset).stat().st_size>50,f'Missing asset: {asset}'
          assert set(photos)==used,f'Unused photos in manifest: {set(photos)-used}'
          for key in used:
              p=Path('_site/assets/photos') / (key+'.webp')
              assert p.is_file() and p.stat().st_size>2048,f'Missing photo {key}'
          print(f'OK: {len(pages)} pages, {len(used)} locally hosted WebP photos, valid anchors/assets.')
          PY
          node --check pages.js
          node --check home.js
          node --check modern.js
          mkdir -p _site/assets
          cp index.html amerique.html europe.html concept.html methode.html prestations.html faq.html contact.html _site/
          cp pages.css pages.js home.css home.js modern.css modern-home.css modern.js _site/
          cp assets/euramerica-route.svg _site/assets/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/euramerica-route.svg
      - name: Browser smoke test on mobile, tablet and desktop
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node scripts/ui-smoke.cjs
      - name: Save browser snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euramerica-design-snapshots
          path: ui-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
