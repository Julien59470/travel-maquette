name: Deploy Travel Maquette to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate and prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/favicon.svg
          grep -q 'href="styles.css"' index.html
          grep -q 'src="script.js"' index.html
          mkdir -p _site/assets
          cp index.html styles.css script.js _site/
          cp assets/favicon.svg _site/assets/
          touch _site/.nojekyll
          echo "Static maquette verified; ready for GitHub Pages."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
