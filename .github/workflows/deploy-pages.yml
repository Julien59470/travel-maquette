name: Deploy Travel Maquette to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-maquette-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate standalone HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate HTML and inline JS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from html.parser import HTMLParser
          source = Path('index.html').read_text(encoding='utf-8')
          assert source.startswith('<!doctype html>'), 'index.html absent ou incorrect'
          assert source.count('<style>') == 1 and source.count('<script>') == 1, 'La maquette doit rester autonome'
          assert 'noindex,nofollow' in source, 'La maquette ne doit pas être indexée'
          assert 'id="portal-canvas"' in source and 'id="preloader-video"' in source, 'Portail ou preloader absent'
          assert not re.search(r'<script[^>]+src=', source), 'JavaScript externe interdit'
          assert not re.search(r'<link[^>]+rel="stylesheet"[^>]+href="/(?:src|assets)', source), 'Build requis'
          match = re.search(r'<script>\s*([\s\S]*?)</script>', source)
          assert match, 'JavaScript inline introuvable'
          Path('/tmp/travel-inline.js').write_text(match.group(1), encoding='utf-8')
          class CheckHTML(HTMLParser):
              def error(self, message): raise ValueError(message)
          CheckHTML().feed(source)
          print('Autonomous HTML validated: ', len(source), 'bytes')
          PY
          node --check /tmp/travel-inline.js
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
      - name: Check demo video availability
        shell: bash
        run: |
          status=$(curl -L -s -o /dev/null -w '%{http_code}' -I --max-time 15 'https://cdn.coverr.co/videos/coverr-stream-next-to-the-road-4482/1080p.mp4' || true)
          echo "External video HTTP status: $status"
          if [ "$status" != "200" ] && [ "$status" != "206" ]; then
            echo 'Note: the demo will fall back to its cinematic still image.'
          fi
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
